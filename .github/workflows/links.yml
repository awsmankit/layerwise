name: Check links weekly

# Every Monday, check the links that lessons, case studies and the libraries map depend on.
# If any are broken, open an issue (or add a comment to the open one) so they get fixed.
# Links a site refuses to serve to scripts (403, 406, 429) are listed as "blocked", not broken.

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check lesson sources, case studies and libraries
        id: check
        run: |
          set +e
          {
            echo "## Lesson source links"
            node scripts/check-source-links.mjs
            echo
            echo "## Case studies"
            node scripts/check-case-links.mjs
            echo
            echo "## Libraries"
            node scripts/check-libraries.mjs
          } > report.md 2>&1
          cat report.md
          if grep -qE '^(BROKEN|ARCHIVED)' report.md; then echo "broken=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update an issue
        if: steps.check.outputs.broken == 'true'
        run: |
          gh label create link-check --description "The weekly link check found problems" --color D93F0B 2>/dev/null || true
          {
            echo "The weekly link check found links to fix. Entries marked BLOCKED are not broken: open them in a browser."
            echo
            echo '```'
            head -c 60000 report.md
            echo '```'
          } > body.md
          existing=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "Link check: broken links found" --label link-check --body-file body.md
          fi
