name: Publish a GitHub release

# Pushing a tag such as v2.3.0 publishes a GitHub release whose title and notes come from
# src/data/releases.ts (the same data as the /changelog/ page and CHANGELOG.md).
# To release: add the entry to src/data/releases.ts, bump "version" in package.json,
# run `npm run changelog`, commit, then `git tag -a v2.3.0 -m "v2.3.0" && git push origin v2.3.0`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tag matches package.json and the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi
          node scripts/changelog.mjs --check

      - name: Create the release
        run: |
          node scripts/changelog.mjs --notes "$GITHUB_REF_NAME" > notes.md
          TITLE="$(node scripts/changelog.mjs --title "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file notes.md --verify-tag
