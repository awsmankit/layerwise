name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # rebuild every morning so the News page picks up fresh headlines; no commit is needed
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests and type check
        run: |
          npm test
          npx astro check

      # Project sites live at https://<owner>.github.io/<repo>/.
      # A repo named <owner>.github.io is served from the root instead.
      - name: Work out site URL and base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          if [[ "$REPO" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          fi

      # a failed feed keeps its last entries, so this step never fails the build
      - name: Fetch the latest headlines
        run: node scripts/fetch-headlines.mjs
        continue-on-error: true

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
